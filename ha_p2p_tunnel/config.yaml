name: "HA P2P Tunnel"
description: "Túnel Híbrido (P2P + HTTPS 443) com Assistente IA Gemini e Bot Telegram integrados"
version: "0.4.0"
slug: "ha_p2p_tunnel"
init: false
arch:
  - aarch64
  - amd64
url: "https://github.com/jhona1234-del/HA-P2P-Tunnel"
maintainer: "Jhonatan Garcia (jhona1234)"
host_network: true
ingress: true
ingress_port: 8099
